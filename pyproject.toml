[project]
name = "guv-cfd"
version = "0.1.0"
description = "Couple guv-calcs UV fluence-rate physics to OpenFOAM CFD, given a .guv project file."
requires-python = ">=3.11"
dependencies = [
    "guv-calcs @ git+https://github.com/hclaus/guv-calcHC.git@85e2957",
    "numpy>=1.26.4,<3.0.0",
    "dash>=2.17.0,<3.0.0",
    "dash-bootstrap-components>=1.6.0,<2.0.0",
    "python-docx>=1.2.0",
    "pyside6>=6.11.1",
    "pyvista>=0.48.4",
    "pyvistaqt>=0.12.0",
    "matplotlib>=3.11.0",
    "paramiko>=3.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
# Restrict default collection to tests/ - without this, a bare `pytest`/
# `uv run pytest` (no path argument) scans the whole repo root too, which
# picks up one-off research/debugging scripts that happen to match
# test_*.py (test_potentialfoam_usefulness.py, test_tracer_on_patientward.py)
# but aren't pytest tests at all - their module-level code launches REAL
# OpenFOAM runs against real project paths just from being imported for
# collection. Confirmed directly: this is what actually caused this
# session's multiple 1.5+ hour "pytest is just slow" mysteries - not WSL
# contention from anything else, pytest itself was running a real
# multi-hour pimpleFoam solve during collection every time. Run those
# scripts explicitly (`uv run python test_tracer_on_patientward.py`) when
# actually wanted, never via bare pytest.
testpaths = ["tests"]
